name: Generate Asset Manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'manifest.json'
      - 'README.md'

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          echo "Generating manifest.json..."
          
          # Get current date as version
          VERSION=$(date -u +"%Y.%m.%d")
          
          # Start JSON
          echo "{" > manifest.json
          echo "  \"version\": \"$VERSION\"," >> manifest.json
          echo "  \"files\": [" >> manifest.json
          
          FIRST=true
          
          # Find all files except .github, manifest.json, README, and hidden files
          find . -type f \
            ! -path './.github/*' \
            ! -path './.git/*' \
            ! -name 'manifest.json' \
            ! -name 'README.md' \
            ! -name '*.py' \
            ! -name '.gitignore' \
            -print0 | sort -z | while IFS= read -r -d '' file; do
            
            # Remove leading ./
            REL_PATH="${file#./}"
            
            # Calculate SHA256 and size
            HASH=$(sha256sum "$file" | cut -d' ' -f1)
            SIZE=$(stat -c%s "$file")
            
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> manifest.json
            fi
            
            printf '    { "path": "%s", "sha256": "%s", "size": %s }' \
              "$REL_PATH" "$HASH" "$SIZE" >> manifest.json
          done
          
          echo "" >> manifest.json
          echo "  ]" >> manifest.json
          echo "}" >> manifest.json
          
          echo "Manifest generated with version $VERSION"
          cat manifest.json | head -20

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          
          if git diff --staged --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "chore: auto-generate manifest.json [skip ci]"
            git push
          fi
