name: Generate Asset Manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'manifest.json'
      - 'README.md'

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install xxhash
        run: pip install xxhash

      - name: Generate manifest.json
        run: |
          python -c "
          import os, json, datetime, xxhash

          manifest = {
              'version': datetime.datetime.utcnow().strftime('%Y.%m.%d'),
              'files': []
          }

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.github', '.git']]
              for file in files:
                  if file in ['manifest.json', 'README.md', '.gitignore'] or file.endswith('.py'):
                      continue
                  path = os.path.join(root, file)
                  rel_path = os.path.relpath(path, '.').replace('\\\\', '/')
                  
                  with open(path, 'rb') as f:
                      content = f.read()
                  
                  # Both C# System.IO.Hashing.XxHash3 and python xxhash hexdigest 
                  # output strictly matching hex strings. No byte reversal needed.
                  hash_hex = xxhash.xxh3_64(content).hexdigest()
                  size = os.path.getsize(path)
                  
                  manifest['files'].append({
                      'path': rel_path,
                      'hash': hash_hex,
                      'size': size
                  })

          manifest['files'].sort(key=lambda x: x['path'])
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, separators=(',', ':'))
          "
          cat manifest.json | head -20

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          
          if git diff --staged --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "chore: auto-generate manifest.json [skip ci]"
            git push
          fi
